<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbf7f0">
  <title>APItracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><span class="brand-dot"></span>APItracker</h1>
      <div class="top-actions">
        <button id="serverBtn" class="btn ghost small" type="button" hidden>Server</button>
        <button id="checkAll" class="btn primary" type="button">Check all</button>
      </div>
    </div>
    <p id="runInfo" class="run-info"></p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="hero" class="hero" aria-label="Summary"></section>

  <main>
    <section id="tab-services"></section>

    <section id="tab-issues" hidden>
      <div class="screen-head"><h2>Issues</h2><p class="muted small">Problems found by the checks or reported by the app.</p></div>
      <div class="filters">
        <button type="button" class="chip active" data-filter="open">Open</button>
        <button type="button" class="chip" data-filter="resolved">Resolved</button>
        <button type="button" class="chip" data-filter="all">All</button>
      </div>
      <div id="issues"></div>
    </section>

    <section id="tab-expiry" hidden>
      <div class="screen-head"><h2>Expiry</h2><p class="muted small">Balances and renewal dates, soonest first.</p></div>
      <div id="expiryList"></div>
    </section>

    <section id="tab-gst" hidden>
      <div class="screen-head"><h2>GST tracker</h2><p class="muted small">Who is calling the GST verification API, and how often.</p></div>
      <div id="gstBody"></div>
    </section>
  </main>

  <nav class="dock" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tab="services" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span></button>
    <button type="button" role="tab" data-tab="issues"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v5M12 17.5h.01"/></svg><span>Issues</span><b id="issueCount" class="count" hidden></b></button>
    <button type="button" role="tab" data-tab="expiry"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Expiry</span></button>
    <button type="button" role="tab" data-tab="gst"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="m9.5 14.5 5-5M9.8 9.8h.01M14.2 14.2h.01"/></svg><span>GST</span></button>
  </nav>

  <dialog id="metaDialog">
    <form id="metaForm" method="dialog">
      <h2 id="metaTitle">Balance &amp; expiry</h2>
      <p class="muted small">For what the API can't report: credit bought and left, renewal date, card on file.</p>
      <div class="field-row">
        <label>Total amount <input name="amountTotal" placeholder="e.g. $50 or ₹5,000" maxlength="40"></label>
        <label>Amount left <input name="amountLeft" placeholder="e.g. $12.40" maxlength="40"></label>
      </div>
      <div class="field-row">
        <label>What expires <input name="expiryLabel" placeholder="Plan renewal" maxlength="60"></label>
        <label>Expiry date <input name="expiresOn" type="date"></label>
      </div>
      <label>Plan <input name="plan" placeholder="e.g. Pro monthly" maxlength="80"></label>
      <label>Notes <textarea name="notes" rows="3" maxlength="1000" placeholder="Who pays, which card, login email…"></textarea></label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="metaClear">Clear</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="metaCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
