# nginx site for APItracker: copy to /etc/nginx/conf.d/apitracker.conf,
# then `sudo nginx -t && sudo systemctl reload nginx`, then
# `sudo certbot --nginx -d apitracker.mrpscan.com` to add https.
server {
    listen 80;
    server_name apitracker.mrpscan.com;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend reads the last X-Forwarded-For hop as the real visitor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
